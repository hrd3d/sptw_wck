<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPTxWC</title>
<link rel="icon" type="image/png" href="logo1.png">

<!-- XLSX LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    font-size:14px;

    background:
    radial-gradient(circle at top left,#1b2735,#090a0f 50%);

    color:white;
    overflow-x:hidden;
}

/* BACKGROUND GLOW */
body::before{
    content:'';
    position:fixed;
    width:600px;
    height:600px;
    background:#ff7a001f;
    filter:blur(120px);
    top:-250px;
    right:-150px;
    z-index:-2;
}

body::after{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    background:#0066ff1f;
    filter:blur(120px);
    bottom:-250px;
    left:-150px;
    z-index:-2;
}

/* FIXED HEADER */
.logo-container{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);

    width:95%;
    max-width:900px;

    padding:22px;

    background:rgba(255,255,255,.06);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.08);

    border-radius:24px;

    z-index:9999;

    box-shadow:
    0 10px 40px rgba(0,0,0,.45);
}

/* LOGO */
.logo-container img{
    height:85px;
    display:block;
    margin:0 auto;
}

/* SEARCH WRAPPER */
.search-wrapper{
    position:relative;
    width:100%;
    margin-top:20px;
}

/* SEARCH BOX */
#searchBox{
    width:100%;

    padding:18px 20px;

    border:none;
    outline:none;

    border-radius:18px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    color:white;

    font-size:15px;

    border:1px solid rgba(255,255,255,.08);

    transition:.3s;
}

#searchBox:focus{
    border:1px solid #ff7a00;

    box-shadow:
    0 0 25px rgba(255,122,0,.25);
}

#searchBox::placeholder{
    color:#9aa4b2;
}

/* DROPDOWN */
#searchResults{
    position:absolute;

    top:100%;
    left:0;

    width:100%;

    margin-top:8px;

    background:#111827;

    border-radius:18px;

    overflow:hidden;

    max-height:264px;

    overflow-y:auto;

    z-index:1000;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 15px 40px rgba(0,0,0,.55);
}

/* RESULT ITEM */
.result-item{
    padding:14px 16px;

    cursor:pointer;

    transition:.2s;

    border-bottom:1px solid rgba(255,255,255,.05);
}

.result-item:hover{
    background:#1f2937;
}

.result-id{
    font-size:14px;
    font-weight:700;
    color:white;
}

.result-category{
    margin-top:4px;

    font-size:12px;

    color:#9aa4b2;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* MAIN CONTENT */
.container{
    padding-top:230px;
    padding-left:20px;
    padding-right:20px;
    padding-bottom:100px;

    max-width:1200px;

    margin:0 auto;
}

/* GRID */
#output{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(420px,1fr));

    gap:20px;
}

/* CARD */
.data-card{
    position:relative;

    overflow:hidden;

    background:rgba(255,255,255,.06);

    backdrop-filter:blur(20px);

    border-radius:24px;

    padding:24px;

    border:1px solid rgba(255,255,255,.06);

    transition:.3s;

    animation:fadeUp .5s ease;
}

/* CARD GLOW */
.data-card::before{
    content:'';

    position:absolute;

    width:220px;
    height:220px;

    background:rgba(255,122,0,.08);

    border-radius:50%;

    top:-120px;
    right:-120px;
}

/* HOVER */
.data-card:hover{
    transform:translateY(-4px);

    border-color:rgba(255,122,0,.35);

    box-shadow:
    0 10px 35px rgba(0,0,0,.45);
}

/* TEXT */
.data-card div{
    line-height:1.8;
    color:#d8dee9;
}

.data-card b{
    color:white;
    font-weight:700;
}

/* HIGHLIGHT */
mark{
    background:#ffe066;

    color:#000;

    padding:2px 6px;

    border-radius:6px;

    font-weight:800;

    box-shadow:
    0 0 10px rgba(255,224,102,.55);
}

/* ACTIVE CARD */
.active-highlight{
    animation:popHighlight .6s ease;
}

/* POPUP */
.toast{
    position:fixed;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    padding:14px 22px;

    border-radius:14px;

    color:white;

    display:none;

    backdrop-filter:blur(20px);

    z-index:99999;
}

.toast.success{
    background:rgba(40,167,69,.9);
}

.toast.error{
    background:rgba(220,53,69,.9);
}

/* ANIMATIONS */
@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes popHighlight{

    0%{
        transform:scale(1);
        box-shadow:0 0 0 rgba(255,122,0,0);
    }

    50%{
        transform:scale(1.02);

        box-shadow:
        0 0 35px rgba(255,122,0,.55),
        0 0 80px rgba(255,122,0,.18);
    }

    100%{
        transform:scale(1);
        box-shadow:0 0 0 rgba(255,122,0,0);
    }

}

/* MOBILE */
@media(max-width:900px){

    #output{
        grid-template-columns:1fr;
    }

    .logo-container{
        width:92%;
    }

}



</style>
</head>

<body>




<!-- CLICKABLE LOGO -->
<div class="logo-container">
<img src="logo2.png" style="cursor:default;">

    <div class="search-wrapper">
        <input type="text" id="searchBox" placeholder="Search...">
        <div id="searchResults"></div>
    </div>
</div>


<!-- DATA OUTPUT -->
<div class="container" id="output"></div>

<!-- POPUP -->
<div id="toast" class="toast"></div>

<script src="ck.js"></script>

<script>
const output = document.getElementById("output");
const toast = document.getElementById("toast");

function showToast(message, type) {
    toast.innerText = message;
    toast.className = "toast " + type;
    toast.style.display = "block";

    setTimeout(() => {
        toast.style.display = "none";
    }, 2000);
}


const searchBox = document.getElementById("searchBox");
const resultsBox = document.getElementById("searchResults");

let globalData = []; // store uploaded data

function renderData(rows) {
    output.innerHTML = "";
    globalData = rows; // store for search

    rows.forEach(row => {
        const card = document.createElement("div");
        card.className = "data-card";

        card.dataset.fulltext = (
            (row["LNC ID"] || "") + " " +
            (row["Category Name (English)"] || "") + " " +
            (row["English Keyword"] || "") + " " +
            (row["Reminder"] || "")
        ).toLowerCase();

const originalHTML = `
    <div><b>LNCID:</b> ${row["LNC ID"] || ""}</div>
    <div><b>Category Name (English):</b> ${row["Category Name (English)"] || ""}</div>
    <div><b>English Keyword:</b> ${row["English Keyword"] || ""}</div>
    <div><b>Reminder:</b> ${row["Reminder"] || ""}</div>
`;

card.dataset.original = originalHTML; 
card.innerHTML = originalHTML;

        output.appendChild(card);
    });
}

searchBox.addEventListener("input", function () {
    const query = this.value.toLowerCase().trim();

    if (query.length < 3) {
        resultsBox.style.display = "none";
        resetCards();
        return;
    }

    const filtered = globalData.filter(row =>
        (row["LNC ID"] || "").toLowerCase().includes(query) ||
        (row["Category Name (English)"] || "").toLowerCase().includes(query) ||
        (row["English Keyword"] || "").toLowerCase().includes(query) ||
        (row["Reminder"] || "").toLowerCase().includes(query)
    );

    renderDropdown(filtered);
    filterCards(query);
    highlightMatches(query);
});

function renderDropdown(data) {
    if (data.length === 0) {
        resultsBox.style.display = "none";
        return;
    }

    resultsBox.innerHTML = data.map(row => `
        <div class="result-item" data-id="${row["LNC ID"]}">
            <div class="result-id">LNCID: ${row["LNC ID"]}</div>
            <div class="result-category">
                Category Name (English): ${row["Category Name (English)"]}
            </div>
        </div>
    `).join("");

    resultsBox.style.display = "block";
}

resultsBox.addEventListener("click", function (e) {
    const item = e.target.closest(".result-item");
    if (!item) return;

    const id = item.dataset.id;

    const target = [...document.querySelectorAll(".data-card")]
        .find(card => card.innerText.includes(id));

if (!target) return;

document.querySelectorAll(".data-card").forEach(card => {
    card.classList.remove("active-highlight");
});


target.scrollIntoView({ behavior: "smooth", block: "center" });

setTimeout(() => {

    let count = 0;

    function pulse() {

        if (count >= 4) return;

        target.classList.remove("active-highlight");

        void target.offsetWidth;

        target.classList.add("active-highlight");

        count++;

        setTimeout(pulse, 700);
    }

    pulse();

}, 300);


resultsBox.style.display = "none";

searchBox.blur();});

function filterCards(query) {
    document.querySelectorAll(".data-card").forEach(card => {
        if (card.dataset.fulltext.includes(query)) {
            card.style.display = "block";   // show
        } else {
            card.style.display = "none";    // remove from layout
        }
    });
}

function resetCards() {
    document.querySelectorAll(".data-card").forEach(card => {
        card.style.display = "block";
        card.innerHTML = card.dataset.original; 
    });
}

document.addEventListener("click", function (e) {
    if (!e.target.closest(".search-wrapper")) {
        resultsBox.style.display = "none";
    }
});

searchBox.addEventListener("focus", function () {
    if (this.value.length >= 3) {
        resultsBox.style.display = "block";
    }
});

function highlightMatches(query) {
    const regex = new RegExp(`(${query})`, "gi");

    document.querySelectorAll(".data-card").forEach(card => {
        // restore original first
        card.innerHTML = card.dataset.original;

        if (query.length < 3) return;

        card.querySelectorAll("div").forEach(div => {
    const labelEnd = div.innerHTML.indexOf("</b>");
    if (labelEnd !== -1) {
        const label = div.innerHTML.substring(0, labelEnd + 4);
        const value = div.innerHTML.substring(labelEnd + 4);

        const highlightedValue = value.replace(regex, `<mark>$1</mark>`);
        div.innerHTML = label + highlightedValue;
    }
});
    });
}

renderData(ckData);

showToast(
    "Data loaded successfully!",
    "success"
);

</script>

</body>
</html>
