<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPTxWC</title>
<link rel="icon" type="image/png" href="logo1.png">

<!-- XLSX LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
}

.data-card b {
    font-weight: 600;  /* clean emphasis */
}

/* LOGO FIXED */
.logo-container {
    position: fixed;
    top: 20px;                         /* 🔥 anchor to very top */
    left: 50%;
    transform: translateX(-50%);

    width: 100%;
    max-width: 600px;

    background: #ffffff;
    border: 3px solid #f97316;
    padding: 20px;
    border-radius: 8px;

    z-index: 9999;                  /* 🔥 ensure it's above EVERYTHING */
}

.logo-container img {
    height: 85px;
    display: block;
    margin: 0 auto;
    background: none;   /* 🔥 ensure no box */
    padding: 0;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 160px;                  /* 🔥 match header height */
    background: #ffffff;
    z-index: 998;                   /* just below header */
}

/* CONTENT */
.container {
    margin-top: 20px;
    padding-top: 220px;   /* only push down from header */
    padding-left: 20px;
    padding-right: 20px;
    padding-bottom: 200px;

    max-width: 1000px;     /* 🔥 FIXED WIDTH */
    margin-left: auto;
    margin-right: auto;   /* center it */
    margin: 0 auto;
}

/* ROW CARD */
.data-card {
    background: #f9f9f9;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 10px;
    width: 100%;
    box-sizing: border-box;
}

/* FIELD */
.field {
    margin-bottom: 5px;
}

/* POPUP */
.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 18px;
    border-radius: 6px;
    color: white;
    display: none;
}

.toast.success {
    background: #28a745;
}

.toast.error {
    background: #dc3545;
}

/* SEARCH AREA */
.search-wrapper {
    margin-top: 20px;  /* 🔥 exact spacing you want */
    width: 100%;
}

#searchBox {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    box-sizing: border-box;  /* 🔥 IMPORTANT */
}

/* DROPDOWN */
#searchResults {
    position: absolute;   /* 🔥 key fix */
    top: 100%;
    left: 0;
    width: 100%;

    background: white;
    border: 1px solid #ddd;
    max-height: 250px;
    overflow-y: auto;

    z-index: 2000;        /* above everything */
}

/* RESULT ITEM */
.result-item {
    padding: 8px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
}

.result-item:hover {
    background: #f5f5f5;
}

.result-id {
    font-size: 14px;
    font-weight: bold;
}

.result-category {
    font-size: 12px;
    color: #555;
}

.search-wrapper {
    position: relative;   /* 🔥 anchor for dropdown */
    width: 100%;
    max-width: 600px;
}

.data-card {
    transition: all 0.3s ease;
}

mark {
    background: yellow;
    padding: 0 2px;
}

@keyframes pulseHighlight {
    0%   { transform: scale(1); box-shadow: 0 0 0 rgba(0,0,0,0); }
    50%  { transform: scale(1.03); box-shadow: 0 0 10px rgba(0,0,0,0.4); }
    100% { transform: scale(1); box-shadow: 0 0 0 rgba(0,0,0,0); }
}

.active-highlight {
    animation: pulseHighlight 0.6s ease;
    border: 2px solid #333;   /* or #000 or #666 */
}

#output {
    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 16px;

    max-width: 900px;   /* 🔥 controls overall width */
    margin: 0 auto;     /* 🔥 centers everything */
}

</style>
</head>

<body>

<!-- CLICKABLE LOGO -->
<div class="logo-container">
    <img src="logo2.png"
     style="cursor:pointer;"
     onclick="document.getElementById('fileInput').click()">

    <div class="search-wrapper">
        <input type="text" id="searchBox" placeholder="Search...">
        <div id="searchResults"></div>
    </div>
</div>

<!-- HIDDEN FILE INPUT -->
<input type="file" id="fileInput" accept=".xlsx" style="display:none">

<!-- DATA OUTPUT -->
<div class="container" id="output"></div>

<!-- POPUP -->
<div id="toast" class="toast"></div>

<script>
const fileInput = document.getElementById("fileInput");
const output = document.getElementById("output");
const toast = document.getElementById("toast");

/* 🔥 TOAST FUNCTION */
function showToast(message, type) {
    toast.innerText = message;
    toast.className = "toast " + type;
    toast.style.display = "block";

    setTimeout(() => {
        toast.style.display = "none";
    }, 2000);
}

/* 🔥 FILE HANDLER */
fileInput.addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const validNames = ["ck.xlsx", "pcc.xlsx"];

    if (!validNames.includes(file.name)) {
        showToast("Invalid File!", "error");
        output.innerHTML = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        renderData(json);
        showToast("File successfully extracted!", "success");
    };

    reader.readAsArrayBuffer(file);
});



const searchBox = document.getElementById("searchBox");
const resultsBox = document.getElementById("searchResults");

let globalData = []; // store uploaded data

/* 🔥 MODIFY YOUR renderData */
function renderData(rows) {
    output.innerHTML = "";
    globalData = rows; // store for search

    rows.forEach(row => {
        const card = document.createElement("div");
        card.className = "data-card";

        card.dataset.fulltext = (
            (row["LNC ID"] || "") + " " +
            (row["Category Name (English)"] || "") + " " +
            (row["English Keyword"] || "") + " " +
            (row["Reminder"] || "")
        ).toLowerCase();

const originalHTML = `
    <div><b>LNCID:</b> ${row["LNC ID"] || ""}</div>
    <div><b>Category Name (English):</b> ${row["Category Name (English)"] || ""}</div>
    <div><b>English Keyword:</b> ${row["English Keyword"] || ""}</div>
    <div><b>Reminder:</b> ${row["Reminder"] || ""}</div>
`;

card.dataset.original = originalHTML;   // 🔥 REQUIRED
card.innerHTML = originalHTML;

        output.appendChild(card);
    });
}

searchBox.addEventListener("input", function () {
    const query = this.value.toLowerCase().trim();

    if (query.length < 3) {
        resultsBox.style.display = "none";
        resetCards();
        return;
    }

    const filtered = globalData.filter(row =>
        (row["LNC ID"] || "").toLowerCase().includes(query) ||
        (row["Category Name (English)"] || "").toLowerCase().includes(query) ||
        (row["English Keyword"] || "").toLowerCase().includes(query) ||
        (row["Reminder"] || "").toLowerCase().includes(query)
    );

    renderDropdown(filtered);
    filterCards(query);
    highlightMatches(query);
});

function renderDropdown(data) {
    if (data.length === 0) {
        resultsBox.style.display = "none";
        return;
    }

    resultsBox.innerHTML = data.map(row => `
        <div class="result-item" data-id="${row["LNC ID"]}">
            <div class="result-id">LNCID: ${row["LNC ID"]}</div>
            <div class="result-category">
                Category Name (English): ${row["Category Name (English)"]}
            </div>
        </div>
    `).join("");

    resultsBox.style.display = "block";
}

resultsBox.addEventListener("click", function (e) {
    const item = e.target.closest(".result-item");
    if (!item) return;

    const id = item.dataset.id;

    const target = [...document.querySelectorAll(".data-card")]
        .find(card => card.innerText.includes(id));

if (!target) return;

document.querySelectorAll(".data-card").forEach(card => {
    card.classList.remove("active-highlight");
});

// 🔥 remove highlight (important)
document.querySelectorAll(".data-card").forEach(card => {
    card.innerHTML = card.dataset.original;
});

target.scrollIntoView({ behavior: "smooth", block: "center" });

setTimeout(() => {
    let count = 0;

    function pulse() {
        if (count >= 6) return;

        target.classList.remove("active-highlight");
        void target.offsetWidth;
        target.classList.add("active-highlight");

        count++;
        setTimeout(pulse, 500);
    }

    pulse();
}, 300);
    resultsBox.style.display = "none";
    searchBox.blur();
});

function filterCards(query) {
    document.querySelectorAll(".data-card").forEach(card => {
        if (card.dataset.fulltext.includes(query)) {
            card.style.display = "block";   // show
        } else {
            card.style.display = "none";    // remove from layout
        }
    });
}

function resetCards() {
    document.querySelectorAll(".data-card").forEach(card => {
        card.style.display = "block";
        card.innerHTML = card.dataset.original; // 🔥 remove highlight
    });
}

document.addEventListener("click", function (e) {
    if (!e.target.closest(".search-wrapper")) {
        resultsBox.style.display = "none";
    }
});

searchBox.addEventListener("focus", function () {
    if (this.value.length >= 3) {
        resultsBox.style.display = "block";
    }
});

function highlightMatches(query) {
    const regex = new RegExp(`(${query})`, "gi");

    document.querySelectorAll(".data-card").forEach(card => {
        // restore original first
        card.innerHTML = card.dataset.original;

        if (query.length < 3) return;

        card.querySelectorAll("div").forEach(div => {
    const labelEnd = div.innerHTML.indexOf("</b>");
    if (labelEnd !== -1) {
        const label = div.innerHTML.substring(0, labelEnd + 4);
        const value = div.innerHTML.substring(labelEnd + 4);

        const highlightedValue = value.replace(regex, `<mark>$1</mark>`);
        div.innerHTML = label + highlightedValue;
    }
});
    });
}


</script>

</body>
</html>
